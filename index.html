    <!-- Apply the saved theme before paint so dark-mode users never flash white on load.
         Default is light, so absence of a stored "dark" value = light. Kept in sync with
         next-themes (storageKey "theme") configured in src/App.tsx. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
