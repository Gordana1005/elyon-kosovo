; ───────────────────────────────────────────────────────────────────────────
; Elyon VOIP Health — call-quality capture + recording anchor
; (edit /etc/asterisk/extensions_custom.conf)
;
; On hangup of the agent channel we (a) read the RTP QoS + hangup cause so
; problems like one-way audio become visible, and (b) post the recording's
; identity (Asterisk uniqueid + file + start/end) to the CRM so recording↔call
; linkage is anchored on the uniqueid and can never drift (fixes long-call
; misses + recordings showing on the wrong call). Edits:
;
; 1) In [macro-dialout-trunk-predial-hook], where ELYONEXT / OUTNUM are set, ALSO
;    capture the call-start epoch on the same channel (used as the recording's
;    start; harmless if MixMonitor already encodes it in the uniqueid):
;
;       exten => s,n,Set(ELYONSTART=${EPOCH})
;
;    and IMMEDIATELY BEFORE the final `exten => s,n,MacroExit()` register the
;    hangup handler (must be registered before the macro exits):
;
;       exten => s,n,Set(CHANNEL(hangup_handler_push)=elyon-cq,s,1)
;
; 2) Append the standalone [elyon-cq] context below at the end of the file.
;
; Then: `fwconsole reload`. ELYONEXT / OUTNUM / ELYONSTART + ${MIXMONITOR_FILENAME}
; are set on the same channel by the predial macro, so they persist into the
; hangup handler. Both scripts are owner root:asterisk, chmod 750.
; ───────────────────────────────────────────────────────────────────────────

[elyon-cq]
exten => s,1,NoOp(Elyon call-quality + recording capture for ${UNIQUEID})
 same => n,Set(RX=${CHANNEL(rtpqos,audio,rxcount)})
 same => n,Set(TX=${CHANNEL(rtpqos,audio,txcount)})
 same => n,Set(RXPLOSS=${CHANNEL(rtpqos,audio,rxploss)})
 same => n,Set(RXJIT=${CHANNEL(rtpqos,audio,rxjitter)})
 same => n,Set(RTT=${CHANNEL(rtpqos,audio,rtt)})
 same => n,System(/usr/local/bin/elyon-call-quality.sh "${UNIQUEID}" "${ELYONEXT}" "${OUTNUM}" "${HANGUPCAUSE}" "${RX}" "${TX}" "${RXPLOSS}" "${RXJIT}" "${RTT}")
 same => n,System(/usr/local/bin/elyon-recording.sh "${UNIQUEID}" "${ELYONEXT}" "${OUTNUM}" "${MIXMONITOR_FILENAME}" "${ELYONSTART}")
 same => n,Return()
